<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Estándar de la categoría · boceto</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; background: #ffffff; color: #0f172a;
    font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  nav { height: 72px; display: flex; align-items: center; padding: 0 80px; border-bottom: 1px solid #e2e8f0; gap: 32px; }
  .marca { font-size: 24px; font-weight: 700; }
  .links { margin-left: auto; display: flex; gap: 28px; font-size: 15px; color: #475569; }
  .cta { background: #2563eb; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .hero { text-align: center; padding-top: 72px; }
  .chip { display: inline-block; font-size: 14px; color: #2563eb; background: #eff6ff; padding: 6px 12px; border-radius: 999px; }
  h1 { margin: 22px auto 0; font-size: 64px; line-height: 1.05; letter-spacing: -.03em; font-weight: 800; width: 900px; }
  .hero p { margin: 22px auto 0; width: 640px; font-size: 20px; color: #475569; line-height: 1.5; }
  .botones { margin-top: 32px; display: flex; gap: 12px; justify-content: center; }
  .b1 { background: #2563eb; color: #fff; padding: 0 26px; height: 54px; line-height: 54px; border-radius: 10px; font-size: 18px; font-weight: 600; }
  .b2 { border: 1px solid #cbd5e1; padding: 0 26px; height: 54px; line-height: 54px; border-radius: 10px; font-size: 18px; font-weight: 600; }
  .captura { margin: 48px auto 0; width: 1040px; height: 300px; border-radius: 16px 16px 0 0; border: 1px solid #e2e8f0; background: linear-gradient(#f8fafc, #eef2f7); box-shadow: 0 30px 60px rgba(15,23,42,.12); }
</style>
</head>
<body>
  <nav><span class="marca">PsySim</span><span class="links"><span>Producto</span><span>Escenarios</span><span>Preguntas</span></span><span class="cta">Ingresar</span></nav>
  <section class="hero">
    <span class="chip">Simulación clínica con IA</span>
    <h1>Practica la entrevista clínica con pacientes virtuales</h1>
    <p>Escenarios realistas, conversación natural y retroalimentación de tu docente.</p>
    <div class="botones"><span class="b1">Comenzar</span><span class="b2">Ver escenarios</span></div>
    <div class="captura"></div>
  </section>
</body>
</html>
